<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Edit Media Composition</title>
<style>
body { font-family: Arial; background:#f4f4f4; margin:0; padding:0;}
.container { max-width:500px; margin:40px auto; background:#fff; padding:25px; border-radius:10px; box-shadow:0 2px 8px rgba(0,0,0,0.12);}
h2 { text-align:center; color:#2a7f62;}
label { display:block; margin-top:12px; font-weight:600;}
select,input { padding:8px; border:1px solid #ccc; border-radius:6px; font-size:14px; width:100%;}
input[type=number]{width:80px; margin-left:8px;}
button{margin-top:15px; padding:10px 16px; background:#2a7f62; color:white; border:none; border-radius:6px; cursor:pointer;}
button:hover{background:#256b52;}
.btn-add{background:#6b8e23; margin-top:10px;}
.btn-add:hover{background:#56741d;}
.flash{padding:12px;border-radius:6px;margin-bottom:15px;font-weight:600;}
.flash.success{background:#d4edda;color:#155724;border:1px solid #c3e6cb;}
.flash.danger{background:#f8d7da;color:#721c24;border:1px solid #f5c6cb;}
.hormone-row { display: flex; align-items: center; gap:8px; margin-top:6px; }
.hormone-row select { flex: 1; }
.hormone-row input { width: 70px; }
.hormone-row button { background:#c82333; border:none; color:white; border-radius:4px; cursor:pointer; padding:2px 6px; }
.hormone-row button:hover { background:#a71d2a; }
</style>
</head>
<body>
<div class="container">
  <h2>Edit Media Composition</h2>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for category, msg in messages %}
        <div class="flash {{ category }}">{{ msg }}</div>
      {% endfor %}
    {% endif %}
  {% endwith %}

  <form method="POST" action="{{ url_for('edit_media', media_code=media['media_code']) }}">
    <label>Media Code</label>
    <input type="text" name="media_code" value="{{ media['media_code'] }}" readonly>

    <label>Basal Media</label>
    <select name="basal_media" required>
      {% for bm in ['MS','B5','WPM'] %}
        <option value="{{ bm }}" {% if media['basal_media']==bm %}selected{% endif %}>{{ bm }}</option>
      {% endfor %}
    </select>

    <label>Hormones</label>
    <div id="hormone-section">
      {% for h in hormones %}
      <div class="hormone-row">
        <select name="hormone{{ loop.index }}">
          <option value="">--None--</option>
          {% for option in hormone_list %}
            {% set db_hormone = h['hormone_name']|string %}
            <option value="{{ option|e }}" {% if option|e == db_hormone|e %}selected{% endif %}>{{ option }}</option>
          {% endfor %}
        </select>
        
        
        <input type="number" step="0.01" name="hormone{{ loop.index }}_mg" value="{{ h['hormone_mg'] }}">
        <button type="button" onclick="this.parentElement.remove()">❌</button>
      </div>
      {% endfor %}
    </div>

    <button type="button" class="btn-add" onclick="addHormoneRow()">+ Add Hormone</button>

    <div style="margin-top:20px;">
      <button type="submit">💾 Save Changes</button>
      <a href="{{ url_for('register_media_compositions') }}">
        <button type="button" style="background:#888;margin-left:10px;">✖ Cancel</button>
      </a>
    </div>
  </form>
</div>

<script>
function addHormoneRow(){
  const section = document.getElementById('hormone-section');
  const index = section.children.length + 1;
  const hormoneOptions = `
      <option value="">--None--</option>
      <option value="BAP">BAP</option>
      <option value="NAA">NAA</option>
      <option value="2,4-D">2,4-D</option>
      <option value="KIN">KIN</option>
      <option value="IBA">IBA</option>
      <option value="IAA">IAA</option>
      <option value="TDZ">TDZ</option>
      <option value="Picloram">Picloram</option>
      <option value="2IP">2IP</option>
      <option value="GA3">GA3</option>
      <option value="Adenine sulfate">Adenine sulfate</option>
      <option value="Coconut water">Coconut water</option>
      <option value="Ascorbic A.">Ascorbic A.</option>
  `;
  const div = document.createElement('div');
  div.className='hormone-row';
  div.innerHTML=`
    <select name="hormone${index}">${hormoneOptions}</select>
    <input type="number" step="0.01" name="hormone${index}_mg" placeholder="mg">
    <button type="button" onclick="this.parentElement.remove()">❌</button>
  `;
  section.appendChild(div);
}
</script>

</body>
</html>
