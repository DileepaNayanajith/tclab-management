<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Print Mother Bottle</title>
  <style>
    body { font-family: Arial; text-align: center; margin: 50px; }
    img { margin: 20px 0; }
    h2 { color: #2a7f62; }
    @media print {
      button { display: none; }
    }
  </style>
</head>
<body>
  <h2>{{ bottle['plant_name'] }} - Cycle {{ bottle['cycle'] }}</h2>
  <img src="{{ url_for('generate_barcode', barcode_value=bottle['barcode']) }}" alt="barcode">

  <p>Media: {{ bottle['media_code'] }}</p>
  <p>Technician: {{ bottle['technician'] }}</p>

  <button onclick="window.print()">🖨️ Print</button>
</body>
</html>
