<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Print Subculture Barcodes</title>
<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f4f4;
    margin: 0;
    padding: 20px;
}

.header {
    background: #2a7f62;
    color: #fff;
    padding: 15px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-radius: 8px;
    margin-bottom: 20px;
}

.header h2 {
    margin: 0;
}

.container {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
}

.card {
    background: #fff;
    padding: 15px;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    width: 200px;
    text-align: center;
}

.card img {
    max-width: 100%;
    height: auto;
}

.barcode-text {
    margin-top: 4px;
    font-size: 11px;
    font-weight: bold;
    color: #2a7f62;
    word-break: break-word;
}

button {
    margin-bottom: 20px;
    padding: 10px 20px;
    background: #2a7f62;
    color: #fff;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 16px;
}

button:hover {
    background: #256b52;
}

@page {
    size: 30mm 10mm;
    margin: 0;
}

@media print {
    body {
        background: white;
        margin: 0;
        padding: 0;
    }

    .header,
    button {
        display: none;
    }

    .container {
        display: block;
        margin: 0;
        padding: 0;
    }

    .card {
        width: 30mm;
        height: 10mm;
        margin: 0;
        padding: 0;
        box-shadow: none;
        border: none;
        border-radius: 0;
        page-break-after: always;
        break-after: page;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        align-items: center;
        overflow: hidden;
        background: white;
    }

    .card img {
        width: 90%;
        height: auto;
        max-height: 9mm;
    }

    .barcode-text {
        display: block;
        font-size: 6px;
        font-weight: 900;
        color: black;
        margin: 0;
        margin-top: 1mm;
        line-height: 1;
        text-align: center;
    }
}
</style>
</head>
<body>

<div class="header">
    <h2>Print Subculture Barcodes</h2>
    <button id="printBtn">Print</button>
</div>

<div class="container">
    {% for barcode in barcodes %}
    <div class="card">
        <img src="{{ url_for('generate_barcode', barcode_value=barcode) }}" alt="Barcode">
        <p class="barcode-text">{{ barcode }}</p>
    </div>
    {% endfor %}
</div>

<script>
document.getElementById("printBtn").addEventListener("click", function() {
    window.print();
    setTimeout(function() {
        window.location.href = "{{ url_for('subculture_entry') }}";
    }, 1500);
});
</script>

</body>
</html>
