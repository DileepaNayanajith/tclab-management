<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Registered Plants - Natural Foliage TC Lab</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f4f4f4; }
    
    /* Header bar */
    .header {
      background: #2a7f62;
      color: white;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header .nav-left a,
    .header .nav-right a {
      color: white;
      text-decoration: none;
      margin-right: 15px;
      font-weight: bold;
    }
    .header .nav-right a:last-child { margin-right: 0; }
    .header .nav-left a:hover,
    .header .nav-right a:hover { text-decoration: underline; }
    .header .logo {
      height: 40px;
      vertical-align: middle;
      margin-right: 10px;
      border-radius: 10px;
    }

    /* Main container */
    .container {
      max-width: 900px;
      margin: 30px auto;
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h2 { color: #2a7f62; text-align: center; }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    table, th, td { border: 1px solid #ccc; }
    th, td { padding: 10px; text-align: left; }
    th { background: #e0f2ef; }
    tr:nth-child(even) { background: #f9f9f9; }

    .action-btn {
      padding: 6px 10px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      color: white;
      font-weight: bold;
    }
    .update-btn { background: #256b52; }
    .update-btn:hover { background: #1f4d40; }
    .delete-btn { background: #c0392b; }
    .delete-btn:hover { background: #922b21; }

  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="nav-left">
      <img src="{{ url_for('static', filename='img/logoforweb.jpg') }}" alt="Logo" class="logo">
      
    </div>
    <div class="nav-right">
      <a href="{{ url_for('dashboard') }}">🏠 Home</a>
      <a href="{{ url_for('logout') }}">🚪 Logout</a>
    </div>
  </div>

  <!-- Main content -->
  <div class="container">
    <h2>Registered Plants</h2>

    <table>
      <thead>
        <tr>
          <th>Code</th>
          <th>Name</th>
          <th>Variety</th>
          <th>Description</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        {% for plant in plants %}
        <tr>
          <td>{{ plant['code'] }}</td>
          <td>{{ plant['name'] }}</td>
          <td>{{ plant['variety'] }}</td>
          <td>{{ plant['description'] }}</td>
          <td>
            <a href="{{ url_for('update_plant', plant_id=plant['id']) }}">
              <button class="action-btn update-btn">Update</button>
            </a>
            <a href="{{ url_for('delete_plant', plant_id=plant['id']) }}" onclick="return confirm('Are you sure?');">
              <button class="action-btn delete-btn">Delete</button>
            </a>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>

</body>
</html>
